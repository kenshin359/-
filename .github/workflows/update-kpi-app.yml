# ============================================================
#  毎朝KPI報告アプリの入力欄を改良（手動・何度でも安全）
# ------------------------------------------------------------
#  在庫レポート欄の追加と、添付欄ラベルの改善だけを行います。
#  既存のレコード・入力済みデータは一切消しません。
# ============================================================
name: KPIアプリ入力欄の改良（手動）

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-report-system

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 入力欄を改良
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USER: ${{ secrets.KINTONE_USER }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
          KINTONE_KPI_APP_ID: ${{ secrets.KINTONE_KPI_APP_ID || '30' }}
          APP_ENV: production
        run: node kintone/updateKpiApp.js
