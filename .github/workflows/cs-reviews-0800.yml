# ============================================================
#  CSレビュー返信パック  自動送信（毎朝 8:00 日本時間）
# ------------------------------------------------------------
#  ショップレビューと全商品の商品レビューから
#  「過去7日・未返信」を全件拾い、コピペ用の返信文つき
#  エクセルにして Chatwork のCSルームへ送ります。
#
#  ★テンプレート方式（AIキー不要・費用ゼロ）。
#  ★状態管理なし: 毎朝「その時点の未返信一覧」を丸ごと送るので、
#    返信済みのものは翌朝のリストから自動で消えます。
#    取りこぼしも二重送信もこの仕組みでは起きません。
#  ★楽天へは読み取りだけ。自動投稿はしません。
#
#  ★このリポジトリは公開設定です。
#    実行ログにレビュー本文・投稿者名は出しません（件数のみ）。
# ============================================================
name: CSレビュー返信の下書き（毎朝8:00）

on:
  schedule:
    # GitHub の時刻は UTC。日本時間 8:00 = 前日 23:00 UTC
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '何日ぶんさかのぼるか'
        required: false
        default: '7'

concurrency:
  group: cs-reviews
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-report-system

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 設定の確認
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_CS_ROOM_ID: ${{ secrets.CHATWORK_CS_ROOM_ID }}
        run: |
          missing=""
          [ -z "$CHATWORK_API_TOKEN" ]  && missing="$missing CHATWORK_API_TOKEN"
          [ -z "$CHATWORK_CS_ROOM_ID" ] && missing="$missing CHATWORK_CS_ROOM_ID"
          if [ -n "$missing" ]; then
            echo "::error::次の設定（Secrets）が足りません:$missing"
            echo "リポジトリ → Settings → Secrets and variables → Actions で登録してください。"
            exit 1
          fi
          echo "設定OK"

      - name: エクセルライブラリを入れる
        run: pip install --quiet openpyxl

      - name: 未返信レビューを集めて返信文を付ける
        env:
          RAKUTEN_SHOP_ID: ${{ secrets.RAKUTEN_SHOP_ID || '407466' }}
          RAKUTEN_SHOP_CODE: libetee
          APP_ENV: production
        run: node scripts/replyPack.js --days=${{ inputs.days || '7' }}

      - name: エクセルにする
        run: python3 scripts/buildReplyPackXlsx.py out/reply-pack.json out/reply-pack.xlsx

      - name: Chatworkへ送る
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_CS_ROOM_ID: ${{ secrets.CHATWORK_CS_ROOM_ID }}
          CHATWORK_SALES_ROOM_ID: ${{ secrets.CHATWORK_SALES_ROOM_ID }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
          APP_ENV: production
        run: node scripts/sendReplyPack.js
