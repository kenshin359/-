# ============================================================
#  CSレビュー返信の下書き  自動送信（毎朝 8:00 日本時間）
# ------------------------------------------------------------
#  前日ぶんの新しい楽天レビューを拾って、
#  アルバイトの方がそのままコピペできる返信の下書きを作り、
#  Chatwork の CSグループへ送ります。
#
#  ★このリポジトリは公開設定です。
#    実行ログも第三者から見えるため、--quiet を付けて
#    レビュー本文・投稿者名をログに出さないようにしています。
#
#  ★鍵（トークン類）は GitHub の Secrets に入れます。
#    リポジトリ → Settings → Secrets and variables → Actions
# ============================================================
name: CSレビュー返信の下書き（毎朝8:00）

on:
  schedule:
    # GitHub の時刻は UTC。日本時間 8:00 = 前日 23:00 UTC
    - cron: '0 23 * * *'
  # 手動でも動かせるようにしておく（Actions画面の「Run workflow」）
  workflow_dispatch:

# 送信済みの記録をコミットして残すために必要
permissions:
  contents: write

concurrency:
  group: cs-reviews
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-report-system

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 設定の確認
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_CS_ROOM_ID: ${{ secrets.CHATWORK_CS_ROOM_ID }}
          RAKUTEN_SHOP_ID: ${{ secrets.RAKUTEN_SHOP_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          [ -z "$CHATWORK_API_TOKEN" ]  && missing="$missing CHATWORK_API_TOKEN"
          [ -z "$CHATWORK_CS_ROOM_ID" ] && missing="$missing CHATWORK_CS_ROOM_ID"
          [ -z "$RAKUTEN_SHOP_ID" ]     && missing="$missing RAKUTEN_SHOP_ID"
          # ★返信文はお客様のレビューに合わせて書くため、AIの鍵が必須です
          [ -z "$ANTHROPIC_API_KEY" ]   && missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::次の設定（Secrets）が足りません:$missing"
            echo "リポジトリ → Settings → Secrets and variables → Actions で登録してください。"
            exit 1
          fi
          echo "設定OK"

      - name: 返信下書きの作成と送信
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_CS_ROOM_ID: ${{ secrets.CHATWORK_CS_ROOM_ID }}
          RAKUTEN_SHOP_ID: ${{ secrets.RAKUTEN_SHOP_ID }}
          RAKUTEN_ITEM_IDS: ${{ secrets.RAKUTEN_ITEM_IDS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5
          APP_ENV: production
          REPORT_TIMEZONE: Asia/Tokyo
        # ★--quiet: お客様のレビュー本文と投稿者名をログに出しません
        run: npm run replies -- --quiet

      - name: 送信済みの記録を残す
        # ★これをしないと、毎朝おなじレビューの下書きをくり返し送ってしまいます
        run: |
          if [ -n "$(git status --porcelain -- state/replied-reviews.json)" ]; then
            git config user.name  "libetee-bot"
            git config user.email "libetee-bot@users.noreply.github.com"
            git add state/replied-reviews.json
            git commit -m "CSレビュー返信の記録を更新（自動）"
            git push
            echo "記録を保存しました"
          else
            echo "新しく下書きしたレビューはありません"
          fi
