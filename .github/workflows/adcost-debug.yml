# ============================================================
#  広告費デバッグ（内訳検証・push起動）
# ------------------------------------------------------------
#  state/adcost-debug-request.json を更新してpushすると起動し、
#  指定日のMeta広告費（トラベル/カタログ）をファイル・行単位で
#  分解した結果を state/adcost-debug.txt にコミットで返します。
#  ★キントーンは読むだけ。出力の数字はA-J符号化。
# ============================================================
name: 広告費デバッグ（内訳検証）

on:
  push:
    paths:
      - 'daily-report-system/state/adcost-debug-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adcost-debug
  cancel-in-progress: false

jobs:
  debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-report-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 内訳を検証して結果をコミット
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USER: ${{ secrets.KINTONE_USER }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
          KINTONE_KPI_APP_ID: ${{ secrets.KINTONE_KPI_APP_ID }}
        run: |
          python3 scripts/adCostDebug.py
          if [ -n "$(git status --porcelain -- state/adcost-debug.txt)" ]; then
            git config user.name  "libetee-bot"
            git config user.email "libetee-bot@users.noreply.github.com"
            git add state/adcost-debug.txt
            git commit -m "広告費デバッグ結果を更新（自動）"
            git pull --rebase
            git push
          fi
