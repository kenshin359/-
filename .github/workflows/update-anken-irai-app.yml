# ============================================================
#  案件依頼アプリの選択肢更新（手動）
#  種別: テレビ出演・プレスリリース追加／担当者: 黒葛原追加
# ============================================================
name: 案件依頼アプリ更新（手動）

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-report-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 選択肢を更新
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USER: ${{ secrets.KINTONE_USER }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
          APP_ENV: production
        run: node kintone/updateAnkenIraiApp.js
