# ============================================================
#  在庫報告データ取り出し（手動）
# ------------------------------------------------------------
#  在庫報告（CS出荷後）アプリの入力内容をログに出力します。
#  分析資料用。★キントーンは読むだけ。書き込みしません。
# ============================================================
name: 在庫報告取り出し（手動）

on:
  workflow_dispatch:
    inputs:
      days:
        description: '何日ぶんさかのぼるか'
        required: false
        default: '14'

jobs:
  dump:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-report-system

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 取り出してログに出す
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USER: ${{ secrets.KINTONE_USER }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
          KINTONE_STOCK_REPORT_APP_ID: ${{ secrets.KINTONE_STOCK_REPORT_APP_ID }}
          APP_ENV: production
          REPORT_TIMEZONE: Asia/Tokyo
        run: node scripts/stockReportDump.js --days=${{ inputs.days || '14' }}
