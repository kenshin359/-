# ============================================================
#  会社情報（専門家・取引先）アプリの作成＋連絡先登録（手動）
# ------------------------------------------------------------
#  弁護士・社労士・税理士・銀行などの連絡先をまとめるアプリを
#  作成します。連絡先の中身は seed 入力（base64）で渡すため、
#  リポジトリにもログにも残りません。
#  ★既存アプリは一切変更しません。
# ============================================================
name: 会社情報アプリ作成（手動）

on:
  workflow_dispatch:
    inputs:
      app:
        description: '登録だけやり直す場合はアプリ番号（空なら新規作成から）'
        required: false
      seed:
        description: '連絡先JSON（base64）。空ならアプリ作成のみ'
        required: false

jobs:
  create:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-report-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: アプリ作成＋連絡先登録
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USER: ${{ secrets.KINTONE_USER }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
          SEED_RECORDS_B64: ${{ inputs.seed }}
          APP_ENV: production
        run: |
          appid="${{ inputs.app }}"
          if [ -z "$appid" ]; then
            node kintone/createBusinessApps.js contacts | tee /tmp/create.log
            appid=$(grep -o 'appId=[0-9]*' /tmp/create.log | head -1 | cut -d= -f2)
          fi
          echo "対象アプリ番号: $appid"
          node scripts/contactsSeed.js --app=$appid
