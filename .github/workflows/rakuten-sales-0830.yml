# ============================================================
#  楽天の売上を自動でキントーンに入れる
#  毎朝 8:30（日本時間）— Shopify(8:00)・Amazon(8:15)のあと
# ------------------------------------------------------------
#  CSVのダウンロードは要りません。RMSの公式APIから直接取ってきます。
#
#  書き込むのは「売上明細（自動取込）」アプリだけです。
#
#  ★何度動いても二重になりません。
#    その日の「楽天」ぶんだけを入れ替えます。
# ============================================================
name: 楽天売上取込（毎朝7:26・毎晩21:17速報）

on:
  schedule:
    # 日本時間 7:26 = 前日 22:26 UTC（混雑回避のため前倒し）: 前日分の確定取込
    - cron: '26 22 * * *'
    # 日本時間 21:17 = 12:17 UTC: 当日ここまでの速報取込（マラソン日の戦況確認用）
    - cron: '17 12 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: '開始日（YYYY-MM-DD／空なら昨日）'
        required: false
      to:
        description: '終了日（YYYY-MM-DD／空なら開始日と同じ）'
        required: false

concurrency:
  group: rakuten-sales
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-report-system

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 設定の確認
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USER: ${{ secrets.KINTONE_USER }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
          KINTONE_SALES_DETAIL_APP_ID: ${{ secrets.KINTONE_SALES_DETAIL_APP_ID }}
          RAKUTEN_SERVICE_SECRET: ${{ secrets.RAKUTEN_SERVICE_SECRET }}
          RAKUTEN_LICENSE_KEY: ${{ secrets.RAKUTEN_LICENSE_KEY }}
        run: |
          missing=""
          [ -z "$KINTONE_BASE_URL" ]            && missing="$missing KINTONE_BASE_URL"
          [ -z "$KINTONE_USER" ]                && missing="$missing KINTONE_USER"
          [ -z "$KINTONE_PASSWORD" ]            && missing="$missing KINTONE_PASSWORD"
          [ -z "$KINTONE_SALES_DETAIL_APP_ID" ] && missing="$missing KINTONE_SALES_DETAIL_APP_ID"
          [ -z "$RAKUTEN_SERVICE_SECRET" ]      && missing="$missing RAKUTEN_SERVICE_SECRET"
          [ -z "$RAKUTEN_LICENSE_KEY" ]         && missing="$missing RAKUTEN_LICENSE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::次の設定（Secrets）が足りません:$missing"
            exit 1
          fi
          echo "設定OK"

      - name: 楽天の売上を取り込む
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USER: ${{ secrets.KINTONE_USER }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
          KINTONE_SALES_DETAIL_APP_ID: ${{ secrets.KINTONE_SALES_DETAIL_APP_ID }}
          RAKUTEN_SERVICE_SECRET: ${{ secrets.RAKUTEN_SERVICE_SECRET }}
          RAKUTEN_LICENSE_KEY: ${{ secrets.RAKUTEN_LICENSE_KEY }}
          # 取込結果をChatworkに知らせる（売上グループ）
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_SALES_ROOM_ID: ${{ secrets.CHATWORK_SALES_ROOM_ID }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
          APP_ENV: production
          REPORT_TIMEZONE: Asia/Tokyo
        run: |
          args=""
          if [ -n "${{ inputs.from }}" ]; then args="$args --from=${{ inputs.from }}"; fi
          if [ -n "${{ inputs.to }}" ];   then args="$args --to=${{ inputs.to }}"; fi
          # 夜の定期実行（UTC 10〜14時台）は「当日ここまで」の速報として取り込む。
          # 朝の定期実行は「直近3日ぶん」を取り直す（＝遅れて反映された注文や
          # 後から入ったキャンセルを毎朝自動で吸収する。二重にはならない仕組み）。
          if [ -z "$args" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            hour=$(date -u +%H)
            if [ "$hour" -ge 10 ] && [ "$hour" -le 14 ]; then
              today=$(TZ=Asia/Tokyo date +%F)
              args="--from=$today --to=$today"
              echo "夜の速報モード: $today の当日分を取り込みます（翌朝の便で確定し直します）"
            else
              from=$(TZ=Asia/Tokyo date -d '3 days ago' +%F)
              to=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
              args="--from=$from --to=$to"
              echo "朝の確定モード: $from 〜 $to の3日ぶんを取り直します（数字のずれ防止）"
            fi
          fi
          node scripts/rakutenImport.js $args
