# ============================================================
#  売上・日報レポート  自動送信（毎晩 19:00 日本時間）
# ------------------------------------------------------------
#  Kintone の売上・転換率報告アプリを見て、
#  新しく記載された日があれば分析つきで Chatwork に通知し、
#  直近14日の簡易シート（Excel）を添付します。
#
#  送信先はテスト用グループ（CHATWORK_SALES_ROOM_ID）で確定です。
#
#  ★Kintone は読むだけ。書き込みは一切しません。
#  ★鍵（パスワード・トークン類）は GitHub の Secrets に入れます。
#    リポジトリ → Settings → Secrets and variables → Actions
# ============================================================
name: 売上レポート（毎晩19:00）

on:
  schedule:
    # GitHub の時刻は UTC。日本時間 19:00 = 同日 10:00 UTC
    - cron: '0 10 * * *'
  workflow_dispatch:

# 通知済みの記録をコミットして残すために必要
permissions:
  contents: write

concurrency:
  group: sales-report
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-report-system

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Excel作成に使う部品を入れる
        run: pip install --quiet openpyxl

      - name: 設定の確認
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USER: ${{ secrets.KINTONE_USER }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_SALES_ROOM_ID: ${{ secrets.CHATWORK_SALES_ROOM_ID }}
        run: |
          missing=""
          [ -z "$KINTONE_BASE_URL" ]        && missing="$missing KINTONE_BASE_URL"
          [ -z "$KINTONE_USER" ]            && missing="$missing KINTONE_USER"
          [ -z "$KINTONE_PASSWORD" ]        && missing="$missing KINTONE_PASSWORD"
          [ -z "$CHATWORK_API_TOKEN" ]      && missing="$missing CHATWORK_API_TOKEN"
          [ -z "$CHATWORK_SALES_ROOM_ID" ]  && missing="$missing CHATWORK_SALES_ROOM_ID"
          if [ -n "$missing" ]; then
            echo "::error::次の設定（Secrets）が足りません:$missing"
            echo "リポジトリ → Settings → Secrets and variables → Actions で登録してください。"
            exit 1
          fi
          echo "設定OK"

      - name: 売上の確認と通知
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USER: ${{ secrets.KINTONE_USER }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
          KINTONE_SALES_APP_ID: ${{ secrets.KINTONE_SALES_APP_ID }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_SALES_ROOM_ID: ${{ secrets.CHATWORK_SALES_ROOM_ID }}
          APP_ENV: production
          REPORT_TIMEZONE: Asia/Tokyo
        run: node scripts/watchSales.js

      - name: 通知済みの記録を残す
        # ★これをしないと、毎晩おなじ日の通知をくり返し送ってしまいます
        run: |
          if [ -n "$(git status --porcelain -- state/notified-sales.json)" ]; then
            git config user.name  "libetee-bot"
            git config user.email "libetee-bot@users.noreply.github.com"
            git add state/notified-sales.json
            git commit -m "売上通知の記録を更新（自動）"
            git push
            echo "記録を保存しました"
          else
            echo "新しく通知した日はありません"
          fi
