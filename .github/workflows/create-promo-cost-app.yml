# ============================================================
#  販促費管理アプリの作成（手動）
# ------------------------------------------------------------
#  Google広告・TikTok広告・案件依頼費・テレビ出演費用・PRタイムズ
#  などの販促支出を管理するアプリを新規作成します。
#  ★既存アプリは一切変更しません。
# ============================================================
name: 販促費管理アプリ作成（手動）

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-report-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: アプリ作成
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USER: ${{ secrets.KINTONE_USER }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
          APP_ENV: production
        run: node kintone/createBusinessApps.js promocost
