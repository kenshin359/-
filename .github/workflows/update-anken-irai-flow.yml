# ============================================================
#  案件依頼アプリ 進行フロー更新（手動）
# ------------------------------------------------------------
#  インフルエンサー案件の8ステップ運用に必要な項目・ステータス・
#  一覧ビューを、既存の「案件依頼」アプリへ追加します。
#  ★追加のみ。既存の選択肢・項目・ビュー・レコードは消しません。
#  ★何度実行しても二重には増えません。
# ============================================================
name: 案件依頼アプリ 進行フロー更新（手動）

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-report-system

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 項目・ステータス・ビューを追加
        env:
          KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
          KINTONE_USER: ${{ secrets.KINTONE_USER }}
          KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
          KINTONE_ANKEN_IRAI_APP_ID: ${{ secrets.KINTONE_ANKEN_IRAI_APP_ID }}
          APP_ENV: production
        run: node kintone/updateAnkenIraiFlow.js
