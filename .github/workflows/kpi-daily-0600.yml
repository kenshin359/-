# ============================================================
#  O2GYM 広告売上KPI 自動連携（毎朝 6:00 日本時間）
# ------------------------------------------------------------
#  STORES / Shopify / Google広告 / Meta広告 の「前日分」を集めて、
#  kintone の KPI管理アプリに 1日1レコードで自動投入します。
#
#  ★各媒体はトークンが無ければ自動でスキップ（段階導入OK）。
#    まずは kintone + Shopify だけでも動きます。
#  ★鍵（トークン類）は GitHub の Secrets に入れます。
#    リポジトリ → Settings → Secrets and variables → Actions
# ============================================================
name: KPI自動連携（毎朝6:00）

on:
  schedule:
    # GitHub の時刻は UTC。日本時間 6:00 = 前日 21:00 UTC
    - cron: '0 21 * * *'
  workflow_dispatch:      # 手動でも実行できる（Actions画面の Run workflow）
    inputs:
      date:
        description: '取り込む日付（YYYY-MM-DD、空なら昨日）'
        required: false

concurrency:
  group: kpi-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kpi-ads

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 必須設定（kintone）の確認
        env:
          KINTONE_SUBDOMAIN: ${{ secrets.KINTONE_SUBDOMAIN }}
          KINTONE_KPI_APP_ID: ${{ secrets.KINTONE_KPI_APP_ID }}
          KINTONE_KPI_API_TOKEN: ${{ secrets.KINTONE_KPI_API_TOKEN }}
        run: |
          missing=""
          [ -z "$KINTONE_SUBDOMAIN" ]     && missing="$missing KINTONE_SUBDOMAIN"
          [ -z "$KINTONE_KPI_APP_ID" ]    && missing="$missing KINTONE_KPI_APP_ID"
          [ -z "$KINTONE_KPI_API_TOKEN" ] && missing="$missing KINTONE_KPI_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::次の Secrets が足りません:$missing"
            echo "リポジトリ → Settings → Secrets and variables → Actions で登録してください。"
            exit 1
          fi
          echo "kintone 設定OK（各媒体トークンは任意）"

      - name: KPIを集めて kintone へ投入
        env:
          # kintone
          KINTONE_SUBDOMAIN: ${{ secrets.KINTONE_SUBDOMAIN }}
          KINTONE_KPI_APP_ID: ${{ secrets.KINTONE_KPI_APP_ID }}
          KINTONE_KPI_API_TOKEN: ${{ secrets.KINTONE_KPI_API_TOKEN }}
          # フィールドコード（既定と違う場合のみ）
          KPI_FC_DATE: ${{ secrets.KPI_FC_DATE }}
          KPI_FC_ACCESS: ${{ secrets.KPI_FC_ACCESS }}
          KPI_FC_SIGNUPS: ${{ secrets.KPI_FC_SIGNUPS }}
          KPI_FC_SALES_STORES: ${{ secrets.KPI_FC_SALES_STORES }}
          KPI_FC_SALES_SHOPIFY: ${{ secrets.KPI_FC_SALES_SHOPIFY }}
          KPI_FC_AD_GOOGLE: ${{ secrets.KPI_FC_AD_GOOGLE }}
          KPI_FC_AD_META: ${{ secrets.KPI_FC_AD_META }}
          # Shopify
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          # Meta
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          # Google Ads
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: node src/main.js ${{ github.event.inputs.date }}
