# VPS（さくらVPS / Xserver VPS / ConoHa VPS 等）向け。docs/ops.md 参照。
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: libetee
      POSTGRES_USER: libetee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libetee -d libetee"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://libetee:${POSTGRES_PASSWORD}@db:5432/libetee
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?.env に NEXTAUTH_SECRET を設定してください}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?.env に NEXTAUTH_URL（https://公開ドメイン）を設定してください}
      SEED_DEMO: ${SEED_DEMO:-0}
    ports:
      - "127.0.0.1:3000:3000"   # 外部公開は Caddy/nginx 経由（HTTPS）で行う

  # HTTPS終端（Let's Encrypt自動）。DOMAIN を .env に設定。
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?.env に DOMAIN を設定してください}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
